name: Playwright Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Explain platform E2E scope for pull requests
        if: github.event_name == 'pull_request'
        run: |
          echo "::notice::Full platform E2E is not run for pull requests: the current app entrypoint is the seller cashier demo, while legacy platform specs require a separate platform runtime and globals (#voice-app-ready, __SCENARIO_ENGINE__, __VOICE_CHANNEL__)."
          echo "Seller UI changes are validated by the Seller Voice Smoke Test workflow."
      - name: Install dependencies
        if: github.event_name == 'push'
        run: npm ci
      - name: Install Playwright browsers
        if: github.event_name == 'push'
        run: npx playwright install --with-deps chromium
      - name: Run full E2E suite
        if: github.event_name == 'push'
        run: npm run test:e2e
      - name: Verify diagnostic report
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          echo "=== Playwright diagnostic files ==="
          find playwright-report test-results -maxdepth 3 -type f -printf '%p (%s bytes)\n' 2>/dev/null || true
          if [ -f playwright-report/playwright-report-platform-012.json ]; then
            node -e "const r=require('./playwright-report/playwright-report-platform-012.json'); console.log(JSON.stringify({stats:r.stats, suites:r.suites?.length}, null, 2))"
          else
            echo "::warning::Playwright JSON report was not generated."
          fi
      - name: Upload Playwright report
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload test results (traces, screenshots, videos)
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
